[workspace]
resolver = "2"
members = [
    "jungle-core",
    "jungle-client",
    "jungle-examples",
    "jungle-local",
    "jungle-macros",
    "jungle-migrate",
    "jungle-server",
    "jungle-sdk",
    "jungle-persist",
    "jungle-test",
    "jungle-vision",
    "jungle-types",
]
exclude = ["jungle-test/compile-times"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = "1.1"
inception = { git = "https://github.com/nicksenger/inception.git", branch = "jungle" }
typosaurus = { git = "https://github.com/nicksenger/typosaurus.git", branch = "jungle" }
futures = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"
dyn-clone = "1"
thiserror = "2"

[workspace.lints.clippy]
type_complexity = "allow"
