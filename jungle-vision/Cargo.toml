[package]
name = "jungle-vision"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced-sugiyama = { git = "https://github.com/nicksenger/iced-sugiyama.git", branch = "blackholesun", features = ["microdot"] }
rust_sugiyama = { package = "iced-sugiyama-core", git = "https://github.com/nicksenger/iced-sugiyama.git", branch = "blackholesun" }
jungle-client = { path = "../jungle-client" }
jungle-core = { path = "../jungle-core" }
jungle-types = { path = "../jungle-types" }
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { workspace = true }
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"

[lints]
workspace = true
