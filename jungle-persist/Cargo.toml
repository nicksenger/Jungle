[package]
name = "jungle-persist"
version = "0.1.0"
edition = "2021"

[features]
default = []
redb = ["dep:redb", "dep:jungle-migrate", "jungle-migrate/redb"]
postgres = ["dep:sqlx", "dep:jungle-migrate", "jungle-migrate/postgres"]

[dependencies]
jungle-types = { path = "../jungle-types" }
uuid = { workspace = true }
async-trait = { workspace = true }
dyn-clone = { workspace = true }
serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true, features = ["alloc"] }
jungle-migrate = { path = "../jungle-migrate", optional = true, default-features = false }
thiserror = { workspace = true }
tracing = "0.1"
chrono = "0.4"
redb = { version = "4.1", optional = true }
sqlx = { version = "0.8", optional = true, features = ["postgres", "runtime-tokio-rustls", "uuid"] }

[lints]
workspace = true
