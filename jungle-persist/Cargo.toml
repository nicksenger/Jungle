[package]
name = "jungle-persist"
version = "0.1.0"
edition = "2021"

[features]
default = []
fjall = ["dep:fjall", "dep:jungle-migrate", "jungle-migrate/fjall"]
postgres = ["dep:sqlx", "dep:jungle-migrate", "jungle-migrate/postgres"]

[dependencies]
jungle-types = { path = "../jungle-types" }
uuid = { workspace = true }
async-trait = { workspace = true }
dyn-clone = { workspace = true }
serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true, features = ["alloc"] }
jungle-migrate = { path = "../jungle-migrate", optional = true, default-features = false }
thiserror = { workspace = true }
tracing = "0.1"
chrono = "0.4"
fjall = { workspace = true, optional = true }
sqlx = { version = "0.8", optional = true, features = ["postgres", "runtime-tokio-rustls", "uuid"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
