[package]
name = "jungle-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[features]
default = ["opt-in"]
opt-in = []

[dependencies]
inception-derive-gen = { git = "https://github.com/nicksenger/inception.git", branch = "jungle", version = "0.1.0" }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
