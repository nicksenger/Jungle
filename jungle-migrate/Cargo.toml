[package]
name = "jungle-migrate"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["dep:sqlx"]
redb = ["dep:redb"]

[dependencies]
tracing = "0.1"
sqlx = { version = "0.8", optional = true, features = ["postgres", "runtime-tokio-rustls"] }
redb = { version = "4.1", optional = true }
