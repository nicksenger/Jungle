[package]
name = "jungle-sdk"
version = "0.1.0"
edition = "2021"

[features]
default = []
server = ["dep:jungle-server"]
pg = ["server", "jungle-server/postgres"]
redb = ["server", "jungle-server/redb"]
fusion = ["dep:jungle-fusion", "redb"]

[dependencies]
inception = { workspace = true }
jungle-client = { path = "../jungle-client" }
jungle-core = { path = "../jungle-core" }
jungle-fusion = { path = "../jungle-fusion", optional = true }
jungle-macros = { path = "../jungle-macros" }
jungle-server = { path = "../jungle-server", optional = true }
jungle-types = { path = "../jungle-types" }
typosaurus = { workspace = true }

[lints]
workspace = true
