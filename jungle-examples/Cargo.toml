[package]
name = "jungle-examples"
version = "0.1.0"
edition = "2021"

[features]
default = []
viewer = ["dep:jungle-vision", "dep:iced"]
video = ["dep:iced-av1"]
audio = ["dep:welcome-audio"]
redb = []
postgres = ["dep:testcontainers", "dep:testcontainers-modules", "jungle_sdk/pg"]
transport = []
bass = []
drums = []
leadguitar = []
vocals = []
rhythmguitar = []

[dependencies]
futures = { workspace = true }
jungle_sdk = { package = "jungle-sdk", path = "../jungle-sdk", features = ["redb", "local"] }
jungle-vision = { path = "../jungle-vision", optional = true }
iced = { version = "0.14", features = ["tokio", "svg"], optional = true }
iced-av1 = { path = "../../iced-av1", optional = true }
welcome-audio = { path = "examples/welcome/audio", optional = true }
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
testcontainers = { version = "0.23", optional = true }
testcontainers-modules = { version = "0.11", features = ["postgres"], optional = true }
async-trait = { workspace = true }
clap = { version = "4.6", features = ["derive"] }

[[example]]
name = "welcome"
path = "examples/welcome/mod.rs"
required-features = ["viewer", "audio"]

[lints]
workspace = true
