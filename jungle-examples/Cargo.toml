[package]
name = "jungle-examples"
version = "0.1.0"
edition = "2021"

[features]
default = ["zoo-delay"]
zoo-delay = ["jungle-zoo/delay"]

[dependencies]
jungle_sdk = { package = "jungle-sdk", path = "../jungle-sdk", features = ["redb"] }
jungle-zoo = { path = "../jungle-zoo" }
jungle-viewer = { path = "../jungle-viewer" }
iced = { version = "0.14", features = ["tokio"] }
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { workspace = true }

[[bin]]
name = "jungle-view"
path = "src/bin/jungle-view.rs"
