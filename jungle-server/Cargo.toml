[package]
name = "jungle-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["jungle-persist/postgres", "dep:sqlx"]
redb = ["jungle-persist/redb"]

[dependencies]
jungle-persist = { path = "../jungle-persist", default-features = false }
jungle-types = { path = "../jungle-types" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories-next = "2"
dyn-clone = "1"
futures = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-futures = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", optional = true, features = ["postgres", "runtime-tokio-rustls"] }

[lints]
workspace = true
