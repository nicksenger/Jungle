[tasks.regenerate-sqlx-schema]
description = "Regenerate jungle-persist/.sqlx using checked production queries."
workspace = false
script_runner = "bash"
script = '''
set -euo pipefail

if ! command -v docker >/dev/null 2>&1; then
  echo "docker is required for regenerate-sqlx-schema"
  exit 1
fi

container_name="jungle-sqlx-prepare"
port=55433
database_url="postgres://postgres:postgres@127.0.0.1:${port}/postgres"

cleanup() {
  docker rm -f "${container_name}" >/dev/null 2>&1 || true
}
trap cleanup EXIT

docker rm -f "${container_name}" >/dev/null 2>&1 || true
docker run -d \
  --name "${container_name}" \
  -e POSTGRES_PASSWORD=postgres \
  -e POSTGRES_USER=postgres \
  -e POSTGRES_DB=postgres \
  -p "${port}:5432" \
  postgres:17 >/dev/null

until docker exec "${container_name}" pg_isready -U postgres >/dev/null 2>&1; do
  sleep 1
done

docker exec -i "${container_name}" psql -U postgres -d postgres <<'SQL'
CREATE TABLE IF NOT EXISTS jungle_schema_metadata (
    id SMALLINT PRIMARY KEY,
    version INTEGER NOT NULL
);

CREATE TABLE IF NOT EXISTS journeys (
    id UUID PRIMARY KEY,
    namespace TEXT NOT NULL DEFAULT 'default',
    animal_id INTEGER NOT NULL,
    generation INTEGER NOT NULL DEFAULT 0,
    status SMALLINT NOT NULL,
    seed BYTEA NOT NULL
);
CREATE INDEX IF NOT EXISTS idx_journeys_namespace ON journeys (namespace);
CREATE INDEX IF NOT EXISTS idx_journeys_namespace_animal_generation ON journeys (namespace, animal_id, generation);

CREATE TABLE IF NOT EXISTS animal_generations (
    namespace TEXT NOT NULL,
    animal_id INTEGER NOT NULL,
    generation INTEGER NOT NULL,
    updated_at TIMESTAMPTZ NOT NULL,
    PRIMARY KEY (namespace, animal_id)
);

CREATE TABLE IF NOT EXISTS events (
    journey_id UUID NOT NULL REFERENCES journeys(id) ON DELETE CASCADE,
    sequence_id BIGINT NOT NULL,
    kind SMALLINT NOT NULL,
    data BYTEA NOT NULL,
    PRIMARY KEY (journey_id, sequence_id)
);

CREATE TABLE IF NOT EXISTS work_items (
    id UUID PRIMARY KEY,
    journey_id UUID NOT NULL REFERENCES journeys(id) ON DELETE CASCADE,
    kind SMALLINT NOT NULL,
    status SMALLINT NOT NULL,
    expiry TIMESTAMPTZ NOT NULL
);

CREATE TABLE IF NOT EXISTS timer_tasks (
    id UUID PRIMARY KEY,
    journey_id UUID NOT NULL REFERENCES journeys(id) ON DELETE CASCADE,
    status SMALLINT NOT NULL,
    visible_at TIMESTAMPTZ NOT NULL,
    fired_at TIMESTAMPTZ
);
CREATE INDEX IF NOT EXISTS idx_timer_tasks_status_visible_at ON timer_tasks (status, visible_at);

CREATE TABLE IF NOT EXISTS journey_leases (
    journey_id UUID PRIMARY KEY REFERENCES journeys(id) ON DELETE CASCADE,
    owner_id UUID NOT NULL,
    lease_until TIMESTAMPTZ NOT NULL,
    heartbeat_at TIMESTAMPTZ NOT NULL
);

CREATE TABLE IF NOT EXISTS owner_wakes (
    id UUID PRIMARY KEY,
    owner_id UUID NOT NULL,
    journey_id UUID NOT NULL REFERENCES journeys(id) ON DELETE CASCADE,
    timer_id UUID NOT NULL,
    created_at TIMESTAMPTZ NOT NULL
);
CREATE INDEX IF NOT EXISTS idx_owner_wakes_owner_id_created_at ON owner_wakes (owner_id, created_at, id);

CREATE TABLE IF NOT EXISTS animal_appearances (
    journey_id UUID PRIMARY KEY REFERENCES journeys(id) ON DELETE CASCADE,
    data BYTEA NOT NULL,
    updated_at TIMESTAMPTZ NOT NULL
);

CREATE TABLE IF NOT EXISTS animal_perturbations (
    journey_id UUID NOT NULL REFERENCES journeys(id) ON DELETE CASCADE,
    sequence_id BIGINT NOT NULL,
    data BYTEA NOT NULL,
    status SMALLINT NOT NULL,
    claimed_at TIMESTAMPTZ,
    lease_until TIMESTAMPTZ,
    PRIMARY KEY (journey_id, sequence_id)
);

INSERT INTO jungle_schema_metadata (id, version) VALUES (1, 0)
ON CONFLICT (id) DO NOTHING;
SQL

SQLX_OFFLINE=false DATABASE_URL="${database_url}" \
  cargo test -p jungle-test regenerate_sqlx_offline_schema_under_jungle_persist -- --ignored --nocapture
'''
